<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#100b1c"><title>Архив персонажей</title><script>
(async()=>{try{const r=await fetch('data/site.json');const s=await r.json();const id=new URLSearchParams(location.search).get('id')||(s.characters||[])[0];if(id)location.replace('character.html?id='+encodeURIComponent(id));else document.body.textContent='В архиве пока нет персонажей.'}catch(e){document.body.textContent='Не удалось открыть архив.'}})();
</script></head><body>Открываем архив…</body></html>
